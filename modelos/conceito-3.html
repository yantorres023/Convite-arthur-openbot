<!doctype html>

<title>Arthur, 1 ano — Convite (Piquenique dos bichinhos)</title>

<link rel="stylesheet" href="../comum/base.css">

<a class="pular" href="#rsvp">Pular para a confirmação de presença</a>
<div class="pagina">
  <p class="rotulo-topo">Convite de aniversário</p>
  <header class="capa">
    <div class="capa-texto" data-entrada>
      <h1>Arthur</h1>
      <p class="pilula">1 aninho</p>
    </div>
    <div class="arte">
      <div class="lateral lateral-esq"><!--SVG design/v2/conceito-3/assets/sheep.svg bicho capa-ovelha--></div>
      <!--SVG design/v2/conceito-3/assets/fazendinha.svg cena faz-->

  <main id="conteudo">
    <section class="info" aria-label="Data, horário e local" data-entrada>

    <section class="tema" aria-label="Tema">
      <div class="bicho"><!--SVG design/v2/conceito-3/assets/hen.svg bicho tema-galinha--></div>
      <div>
        <p class="tema-chamada">Venha caracterizado:</p>
        <p class="tema-nome">country/<wbr>fazendinha</p>
      </div>
    </section>

    <!--RSVP-->
  </main>

  <footer class="rodape">
    <p class="rodape-nome">Arthur · 1 ano</p>
    <p class="rodape-data">29/11/2026 · 15h</p>
  </footer>
