<section class="rsvp" id="rsvp" aria-labelledby="rsvp-titulo">
  <div class="rsvp-intro">
    <h2 id="rsvp-titulo">Você vem?</h2>
    <p class="rsvp-sub">Confirme sua presença<span class="so-desktop"><br>para o aniversário do Arthur.</span></p>
    <div class="rsvp-bicho"><!--SVG design/v2/conceito-{N}/assets/pig.svg bicho rsvp-porco--></div>
  </div>
  <form class="rsvp-form" data-rsvp novalidate onsubmit="return false">
    <p class="rsvp-sem-js" data-sem-js>Para confirmar presença, o JavaScript precisa estar ativo. Se o botão não funcionar, recarregue a página.</p>
    <fieldset data-rsvp-campos disabled>
    <legend class="sr-only">Confirmação de presença</legend>
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" maxlength="80" aria-describedby="erro-nome">
      <p class="erro" id="erro-nome" data-erro="nome"></p>
    </div>
    <div class="campos-2">
      <div class="campo">
        <label for="adultos">Nº de adultos</label>
        <input id="adultos" name="adultos" type="number" inputmode="numeric" min="0" max="20" step="1" placeholder="0" aria-describedby="erro-adultos">
        <p class="erro" id="erro-adultos" data-erro="adultos"></p>
      </div>
      <div class="campo">
        <label for="criancas">Nº de crianças</label>
        <input id="criancas" name="criancas" type="number" inputmode="numeric" min="0" max="20" step="1" placeholder="0" aria-describedby="erro-criancas">
        <p class="erro" id="erro-criancas" data-erro="criancas"></p>
      </div>
    </div>
    <div class="isca" aria-hidden="true"><label for="website">Não preencha este campo</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <button type="button" class="botao" data-enviar>Confirmar presença</button>
    <p class="rsvp-nota" data-nota>Sua confirmação vai para uma<br>planilha privada.</p>
    <div class="erro-geral" data-erro="total" aria-live="polite"></div>
    <div class="caixa caixa-sucesso" data-sucesso role="status" aria-live="polite" hidden></div>
    <div class="caixa caixa-erro" data-alerta role="alert" hidden></div>
    <p class="sr-only" data-status aria-live="polite"></p>
    </fieldset>
  </form>
</section>
